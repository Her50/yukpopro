# Plausible Community Edition — self-hosted sur Fly.io
#
# Architecture : 3 services co-localisés en CDG
#   1. plausible (Phoenix/Elixir web app) — port 8000
#   2. postgres (sessions, sites, users, API keys)
#   3. clickhouse (events analytics — colonnaire haute perf)
#
# Coût Fly cible : ~$10-15/mois pour <100k pageviews/mois
#   • plausible perf-1x : ~$2/mois auto-stop
#   • postgres shared-cpu-1x : ~$2/mois
#   • clickhouse shared-cpu-2x : ~$5/mois (clickhouse a besoin de RAM/disque)
#   • volumes 10 GB total : ~$2/mois
#
# Setup :
#   1. fly launch --name yukpo-plausible --copy-config --no-deploy
#   2. fly secrets set BASE_URL=https://plausible.yukpomnang.com \
#                       SECRET_KEY_BASE=$(openssl rand -base64 48) \
#                       DATABASE_URL=postgresql://... \
#                       CLICKHOUSE_DATABASE_URL=http://...
#   3. fly volume create plausible_data --size 5 --region cdg
#   4. fly volume create plausible_clickhouse --size 10 --region cdg
#   5. fly deploy
#   6. (depuis YukpoPro) fly secrets set -a yukpopro-backend \
#         PLAUSIBLE_API_BASE=https://plausible.yukpomnang.com/api/v1 \
#         PLAUSIBLE_SCRIPT_URL=https://plausible.yukpomnang.com/js/script.js \
#         PLAUSIBLE_API_KEY=<créée dans le dashboard Plausible après 1er admin>
#
# Voir docs/PLAUSIBLE_SELFHOST.md pour les détails complets.

app = "yukpo-plausible"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  # URL publique du Plausible (utilisée dans les emails et le tracker JS)
  BASE_URL = "https://plausible.yukpomnang.com"
  # Désactive l'enregistrement public — uniquement les invitations admin
  DISABLE_REGISTRATION = "invite_only"
  # Locale par défaut
  LANG = "fr_FR.UTF-8"
  LC_ALL = "fr_FR.UTF-8"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 350

  [[services.http_checks]]
    interval = "30s"
    grace_period = "60s"
    method = "get"
    path = "/api/health"
    timeout = "10s"

[[mounts]]
  source = "plausible_data"
  destination = "/var/lib/plausible"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
