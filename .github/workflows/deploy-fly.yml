name: Deploy Backend → Fly.io

on:
  push:
    branches: [yukpopro-main]
    paths:
      - 'yukpo_assurance/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yukpo_assurance

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create volume bureau_data if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          EXISTING=$(flyctl volumes list --app yukpopro-backend --json 2>/dev/null | grep -c '"bureau_data"' || echo 0)
          if [ "$EXISTING" -lt 2 ]; then
            MISSING=$((2 - EXISTING))
            echo "Creating $MISSING volume(s) bureau_data in cdg..."
            for i in $(seq 1 $MISSING); do
              flyctl volumes create bureau_data --size 1 --region cdg --app yukpopro-backend --yes
            done
          else
            echo "Volumes bureau_data already exist ($EXISTING), skipping."
          fi

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Force restart machine if stopped
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== Machine status ==="
          flyctl status --app yukpopro-backend || true
          echo "=== Restarting app ==="
          flyctl restart --app yukpopro-backend || true
          sleep 20
          echo "=== Health check ==="
          curl -sf https://yukpopro-backend.fly.dev/health || true

      - name: Show recent logs
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs --app yukpopro-backend --no-tail || true
