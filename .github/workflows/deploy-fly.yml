name: Deploy Backend → Fly.io

on:
  push:
    branches: [yukpopro-main]
    paths:
      - 'yukpo_assurance/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yukpo_assurance

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scale to 1 machine and ensure volume exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl scale count 1 --app yukpopro-backend --yes || true
          EXISTING=$(flyctl volumes list --app yukpopro-backend --json 2>/dev/null \
            | python3 -c "import sys,json; print(sum(1 for v in json.load(sys.stdin) if v.get('name')=='bureau_data'))" \
            2>/dev/null || echo 0)
          echo "Volumes existants: ${EXISTING:-0}"
          if [ "${EXISTING:-0}" -lt 1 ]; then
            echo "Création volume bureau_data..."
            flyctl volumes create bureau_data --size 1 --region cdg --app yukpopro-backend --yes
          fi

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 300

      - name: Show status and health check
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== Machine status ==="
          flyctl status --app yukpopro-backend || true
          echo "=== Health check ==="
          curl -sf https://yukpopro-backend.fly.dev/health || true

      - name: Show recent logs
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs --app yukpopro-backend --no-tail || true
