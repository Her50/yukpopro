name: Deploy Frontend → Vercel

on:
  push:
    branches: [yukpopro-main]
    paths:
      - 'yukpopro_web/**'
      - 'packages/admin-dashboard/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Mode monorepo : tout s'execute depuis yukpopro_web/ (qui a le
      # package.json + le rootDirectory du projet Vercel) MAIS le checkout
      # GH Actions a clone tout le repo, donc l'alias Vite
      # ../packages/admin-dashboard/src resout correctement vers le parent.
      # `vercel deploy --prebuilt` upload .vercel/output/ uniquement (pas
      # le cwd entier), ce qui contourne la limitation Vercel CLI sur
      # l'upload limite au cwd.

      - name: Pull Vercel project settings
        working-directory: yukpopro_web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build artifacts
        working-directory: yukpopro_web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: https://yukpopro-backend.fly.dev

      - name: Deploy prebuilt
        working-directory: yukpopro_web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
