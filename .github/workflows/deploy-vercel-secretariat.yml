name: Deploy YukpoSecrétariat → Vercel

on:
  push:
    branches: [yukpopro-main]
    paths:
      - 'yukposecretariat_web/**'
      - 'packages/admin-dashboard/**'
      - '.github/workflows/deploy-vercel-secretariat.yml'
  workflow_dispatch:

env:
  # Project ID Sec en clair (pas un secret en soi -- token + orgId
  # sont les vrais credentials d'authentification).
  VERCEL_PROJECT_ID_SEC: prj_b1SqyO4kKFgoKdtyu6W6nEFudb9l

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Cf. deploy-vercel.yml pour explication mode monorepo.

      - name: Pull Vercel project settings
        working-directory: yukposecretariat_web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_SEC }}

      - name: Build artifacts
        working-directory: yukposecretariat_web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_SEC }}
          VITE_API_URL: https://yukpopro-backend.fly.dev

      - name: Deploy prebuilt
        working-directory: yukposecretariat_web
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_SEC }}
