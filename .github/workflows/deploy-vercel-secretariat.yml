name: Deploy YukpoSecrétariat → Vercel

on:
  push:
    branches: [yukpopro-main]
    paths:
      - 'yukposecretariat_web/**'
      - '.github/workflows/deploy-vercel-secretariat.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        working-directory: yukposecretariat_web
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
