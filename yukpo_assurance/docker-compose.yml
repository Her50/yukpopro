version: "3.9"

# ─── YukpoAssurance — Docker Compose Production ──────────────────────────────
# Usage :
#   make docker-up          → démarrer tout
#   make docker-down        → arrêter
#   make docker-logs        → voir les logs
#   docker compose exec app alembic upgrade head   → migrations
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yukpo_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://yukpo:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/yukpo_assurance
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Définir REDIS_PASSWORD dans .env}@redis:6379/0
      - ENFORCE_COMPAGNIE_ISOLATION=true
      - OTLP_ENABLED=true
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ml_models_data:/app/data/ml_models
    restart: unless-stopped
    networks:
      - yukpo_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: yukpo_postgres
    environment:
      POSTGRES_DB: yukpo_assurance
      POSTGRES_USER: yukpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      # Mot de passe du compte read-only (rapports BI / Grafana)
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?Définir POSTGRES_READONLY_PASSWORD dans .env}
    command: >
      postgres
      -c log_min_duration_statement=1000
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/init_readonly_user.sh:/docker-entrypoint-initdb.d/02_readonly_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukpo -d yukpo_assurance"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - yukpo_net

  # ── Redis (cache + sessions + WebSocket pub/sub) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yukpo_redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?Définir REDIS_PASSWORD dans .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - yukpo_net

  # ── Nginx (reverse proxy + SSL + frontend statique) ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: yukpo_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - yukpo_net

  # ── Sauvegarde automatique PostgreSQL (toutes les 6h — RPO 6h) ─────────────
  backup:
    image: postgres:15-alpine
    container_name: yukpo_backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - ./backups:/backups
    command: >
      sh -c "while true; do
        FNAME=/backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
        pg_dump -h db -U yukpo yukpo_assurance | gzip > $$FNAME && echo \"Sauvegarde OK: $$FNAME\" || echo 'ERREUR sauvegarde';
        find /backups -name '*.sql.gz' -mtime +7 -delete;
        sleep 21600;
      done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yukpo_net

  # ── Prometheus (collecte des métriques) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: yukpo_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - yukpo_net

  # ── Grafana (tableaux de bord monitoring) ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: yukpo_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Définir GRAFANA_PASSWORD dans .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - yukpo_net

  # ── Migration runner (one-shot au démarrage) ─────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yukpo_migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://yukpo:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/yukpo_assurance
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yukpo_net
    restart: "no"

  # ── Jaeger (tracing distribué OpenTelemetry) ─────────────────────────────────
  # SPAN_STORAGE_TYPE=badger → persistance sur disque (perte zéro au restart)
  # Rétention : 72h par défaut (BADGER_SPAN_STORE_TTL)
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: yukpo_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - BADGER_SPAN_STORE_TTL=72h
    ports:
      - "16686:16686"   # UI Jaeger
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
    networks:
      - yukpo_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  ml_models_data:
  jaeger_data:

networks:
  yukpo_net:
    driver: bridge
