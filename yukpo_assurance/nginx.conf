worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    server_tokens off;  # Cacher la version Nginx

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        text/event-stream;
    gzip_min_length 1024;
    gzip_disable "msie6";

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:20m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m      rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_ia:10m        rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_upload:5m     rate=2r/s;

    # ── Logs structurés JSON ─────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"remote_addr":"$remote_addr",'
            '"user_agent":"$http_user_agent",'
            '"referrer":"$http_referer"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    # ── Upstream backend ─────────────────────────────────────────────────────
    upstream backend {
        server app:8000;
        keepalive 64;
    }

    # ── En-têtes de sécurité communs ─────────────────────────────────────────
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:;";
    }


    # ── Serveur HTTP → redirection HTTPS ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (sans redirection pour le load balancer)
        location = /health {
            proxy_pass http://backend;
            access_log off;
        }

        # Tout le reste → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }


    # ── Serveur HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # ─── TLS ───────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Protocoles modernes (TLS 1.2 min, TLS 1.3 préféré)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # ─── En-têtes de sécurité OWASP ────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp_header always;

        # ─── Frontend React ─────────────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        # Assets statiques (JS, CSS, images) — cache long
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ─── Auth (rate limit strict) ───────────────────────────────────────
        location /api/v1/auth/login {
            limit_req zone=api_auth burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ─── Upload fichiers (OCR, documents) ──────────────────────────────
        location ~ ^/api/v1/(documents|comptabilite|souscription)/.*upload {
            limit_req zone=api_upload burst=5 nodelay;
            client_max_body_size 25M;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;  # OCR peut prendre du temps
        }

        # ─── SSE (Server-Sent Events) — pas de buffering ───────────────────
        location ~ ^/api/v1/(stream|chat/message-stream) {
            limit_req zone=api_ia burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";            # Pas de upgrade — garder HTTP/1.1
            proxy_buffering off;                       # CRITIQUE pour SSE
            proxy_cache off;
            proxy_read_timeout 300s;                   # SSE longue durée
            proxy_connect_timeout 10s;

            # En-têtes SSE requis
            add_header X-Accel-Buffering "no";
            add_header Cache-Control "no-cache";
        }

        # ─── WebSocket (collaboration temps réel) ──────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── API générale ───────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;

            # Réponses d'erreur en JSON
            proxy_intercept_errors off;
        }

        # ─── Métriques Prometheus (accès restreint) ─────────────────────────
        location /metrics {
            # Autoriser uniquement les IPs du réseau Docker interne
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny all;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            access_log off;
        }

        # ─── Swagger docs (accès restreint réseau interne uniquement) ─────────
        location /docs {
            # Accès uniquement depuis l'intranet / VPN (sécurité production)
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            # Schéma API — accès restreint réseau interne (même sécurité que /docs)
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend;
            proxy_http_version 1.1;
        }

        location /redoc {
            # Documentation alternative — accès restreint réseau interne
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend;
            proxy_http_version 1.1;
        }

        # ─── Génération documents (timeout long — rapports CIMA, PPT CA) ──────
        location ~ ^/api/v1/documents/(generer|rapport|presentation) {
            limit_req zone=api_ia burst=3 nodelay;
            client_max_body_size 50M;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_read_timeout 360s;   # 6 min — génération rapport CIMA 20 états + PPT
            proxy_send_timeout 60s;
        }

        # ─── Health check ───────────────────────────────────────────────────
        location = /health {
            proxy_pass http://backend;
            access_log off;
            proxy_read_timeout 5s;
        }
    }
}
