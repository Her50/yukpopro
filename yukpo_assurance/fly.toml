# Configuration Fly.io pour yukpopro-backend
# Déployer : fly deploy (depuis yukpo_assurance/)
#
# Autoscaling :
#   - min_machines_running = 1  → 1 machine toujours chaude (0 cold-start pour les users)
#   - soft_limit = 50           → Fly démarre une nouvelle machine dès 50 req simultanées
#   - hard_limit = 100          → max 100 req/machine avant refus (protection)
#   - auto_stop_machines = "stop" → machines supplémentaires s'arrêtent après 5 min d'inactivité
#   - Plafond : 5 machines max (fly scale count) = ~500 simultanés confortables

app = "yukpopro-backend"
primary_region = "cdg"  # Paris — plus proche du Cameroun

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  PYTHONPATH = "/app"
  WORKERS = "2"
  PORT = "8080"
  # Sol B — Active le routage Celery pour les jobs longs.
  # Mettre à "false" pour fallback asyncio.create_task (legacy).
  CELERY_ENABLED = "true"
  CELERY_WORKER_CONCURRENCY = "2"
  # Concurrence semaphore freeform_layout (par worker). Sur shared-cpu-1x → 1,
  # performance-2x → 2, performance-4x → 3.
  FREEFORM_RENDER_CONCURRENCY = "1"

# Sol B — Web + Celery worker dans le MÊME container via supervisord.
# Pourquoi pas [processes] Fly avec VMs séparées : les volumes Fly ne sont
# attachables qu'à 1 machine, donc le worker écrirait des PDFs invisibles
# pour le web. Avec supervisord, web + worker partagent le filesystem local
# et donc le volume monté. Le worker survit toujours aux redeploys car
# Celery `task_acks_late=True` re-publie les tâches en cas de crash du
# container — un nouveau container post-deploy reprend les tâches en queue.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # machines excédentaires s'arrêtent si idle > 5 min
  auto_start_machines = true    # démarrage automatique sous charge
  min_machines_running = 1      # toujours 1 machine chaude (pas de cold-start)

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100   # limite dure par machine
    soft_limit = 50    # seuil → Fly lance une machine supplémentaire

  [http_service.http_options]
    response_timeout = 300  # 5 min — génération IA peut prendre 2-3 min (expert mode)

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "bureau_data"
  destination = "/app/data/generated/bureau"
  initial_size = "1gb"

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "15s"
    method = "get"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
