# Configuration Fly.io pour yukpopro-backend
# Déployer : fly deploy (depuis yukpo_assurance/)
#
# Stratégie scale-to-zero (mai 2026) :
#   - performance-4x : 4 vCPU dédiés + 8 GB RAM = $0.0988/h
#   - min_machines_running = 0  → machine s'arrête complètement si pas de trafic
#                                  Cold-start ~2-5s au premier appel (acceptable
#                                  pour outils B2B non temps-réel)
#   - auto_start_machines = true → wake automatique sur 1ère requête
#   - auto_stop_machines  = "stop" → machine s'éteint après 5 min d'idle
#   - soft_limit = 30           → seuil pour lancer machine supplémentaire
#   - hard_limit = 60           → max req simultanées par machine
#   - Plafond machines : ~10 perf-4x = 40 vCPU dédiés disponibles
#
# Économie attendue vs perf-4x 24/7 ($71/mois) :
#   - Trafic 2h/jour actif → ~$6/mois (-91%)
#   - Trafic 8h/jour       → ~$24/mois (-66%)
#   - Trafic 24/7 saturé   → ~$71/mois (parité)

app = "yukpopro-backend"
primary_region = "cdg"  # Paris — plus proche du Cameroun

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  PYTHONPATH = "/app"
  WORKERS = "2"
  PORT = "8080"
  # Sol B — Active le routage Celery pour les jobs longs.
  # Override via secret `fly secrets set CELERY_ENABLED=false` pour fallback
  # asyncio.create_task (legacy, utile si worker Celery a un bug en prod).
  CELERY_ENABLED = "true"
  CELERY_WORKER_CONCURRENCY = "3"
  # Semaphore freeform_layout (par worker) : sur perf-4x (4 vCPU dédiés),
  # on peut gérer 3 renders ReportLab parallèles sans contention. Le 4e
  # vCPU reste pour /health, /status polling, RAG scheduler, garbage collection.
  FREEFORM_RENDER_CONCURRENCY = "3"

# Sol B — Web + Celery worker dans le MÊME container via supervisord.
# Pourquoi pas [processes] Fly avec VMs séparées : les volumes Fly ne sont
# attachables qu'à 1 machine, donc le worker écrirait des PDFs invisibles
# pour le web. Avec supervisord, web + worker partagent le filesystem local
# et donc le volume monté. Le worker survit toujours aux redeploys car
# Celery `task_acks_late=True` re-publie les tâches en cas de crash du
# container — un nouveau container post-deploy reprend les tâches en queue.

[http_service]
  internal_port = 8080
  force_https = true
  # Scale-to-zero : machine s'éteint après 5 min d'idle. Cold-start au
  # prochain trafic ~2-5s (acceptable B2B). Économie majeure : on ne paie
  # plus la machine quand personne ne l'utilise (nuit, weekend, etc.).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0     # ← 0 = scale-to-zero quand idle

  [http_service.concurrency]
    type = "requests"
    # Limites par machine perf-4x (4 vCPU dédiés) : avec gunicorn 2 workers
    # × 4 vCPU = 8 reqs concurrents tolérés sans saturation. Soft 30 / hard
    # 60 = headroom large pour absorber les bursts sans déclencher une
    # 2e machine trop tôt (chaque scale-up coûte $0.10/h dédié).
    hard_limit = 60
    soft_limit = 30

  [http_service.http_options]
    response_timeout = 300  # 5 min — génération IA peut prendre 2-3 min (expert mode)

# VM perf-4x : 4 vCPU dédiés (vs partagés sur shared-cpu-1x) + 8 GB RAM.
# Gains observés : render PIL/ReportLab ×3-4 plus rapide, FFmpeg stitching
# ×3, audit Vision Sonnet ×2 (CPU pour pdf2image rasterization).
# LLM/IA calls (Claude/GPT/fal/Replicate) restent network-bound, pas de gain.
[[vm]]
  memory   = "8gb"
  cpu_kind = "performance"
  cpus     = 4

[[mounts]]
  source = "bureau_data"
  destination = "/app/data/generated/bureau"
  initial_size = "1gb"

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "15s"
    method = "get"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
